[project]
name = "statistical-analysis-toolkit"
version = "0.1.0"
description = "First-principles statistics and NumPy verification for agent deposits"
readme = "README.md"
authors = [
    { name = "pinkleather221" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0",
]

[project.scripts]
statistical-analysis-toolkit = "statistical_analysis_toolkit:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
